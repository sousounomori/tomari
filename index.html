<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>泊まり表メーカー</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style id="css">
:root{
  color-scheme:light;
  --bg:#f2f4f7;--panel:#ffffff;--panel2:#f7f9fb;--ink:#1a2233;--muted:#66717f;--line:#d6dce4;--line2:#e7ebf0;
  --accent:#3a4da6;--accent-hover:#2f3f8c;--accent-ink:#ffffff;--accent-soft:#e8ebf8;
  --ok:#2b7a4b;--ok-bg:#dff3e6;--warn:#8a5a0a;--warn-bg:#fbeccb;--bad:#c4403f;--bad-bg:#fbe3e2;
  --sat:#e4edf9;--sun:#f9e6e4;--na:#eef1f5;--na-ink:#b4bcc7;--shadow:0 12px 32px rgba(20,30,60,.16);
  --chip-s:62%;--chip-l:87%;--chip-ink-s:50%;--chip-ink-l:28%;--focus:#3a4da6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#141922;--panel:#1d242f;--panel2:#232b38;--ink:#e6eaf1;--muted:#98a3b3;--line:#323c4b;--line2:#2a333f;
    --accent:#8d9df0;--accent-hover:#a5b2f5;--accent-ink:#0f1424;--accent-soft:#2a3354;
    --ok:#7fd39c;--ok-bg:#1d3a2a;--warn:#f0c264;--warn-bg:#3d3113;--bad:#f28b8a;--bad-bg:#47252a;
    --sat:#1f2b40;--sun:#3d2528;--na:#1a212b;--na-ink:#4a5565;--shadow:0 12px 32px rgba(0,0,0,.5);
    --chip-s:38%;--chip-l:26%;--chip-ink-s:60%;--chip-ink-l:82%;--focus:#a5b2f5;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141922;--panel:#1d242f;--panel2:#232b38;--ink:#e6eaf1;--muted:#98a3b3;--line:#323c4b;--line2:#2a333f;
  --accent:#8d9df0;--accent-hover:#a5b2f5;--accent-ink:#0f1424;--accent-soft:#2a3354;
  --ok:#7fd39c;--ok-bg:#1d3a2a;--warn:#f0c264;--warn-bg:#3d3113;--bad:#f28b8a;--bad-bg:#47252a;
  --sat:#1f2b40;--sun:#3d2528;--na:#1a212b;--na-ink:#4a5565;--shadow:0 12px 32px rgba(0,0,0,.5);
  --chip-s:38%;--chip-l:26%;--chip-ink-s:60%;--chip-ink-l:82%;--focus:#a5b2f5;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:13px;line-height:1.5;color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.04em}
header .sub{color:var(--muted);font-size:12px;margin-top:1px}
#savebar{display:inline-flex;align-items:center;gap:8px;font-size:12px}
#savebar .dirty{color:var(--warn);font-weight:700}
#savebar .ro{color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
#savebar .saved{color:var(--muted)}
nav.tabs{display:flex;gap:4px;margin-left:auto}
nav.tabs button{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px}
nav.tabs button:hover{background:var(--accent-soft)}
nav.tabs button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
main{padding:14px 20px 60px;max-width:1640px;margin:0 auto}
section.tab{display:none}section.tab.active{display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.panel h2{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:10px;font-weight:700}
.panel h2 .hint{font-weight:400;color:var(--muted);font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:7px;cursor:pointer;font-size:13px}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.primary:hover{background:var(--accent-hover)}
.btn.save{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:700}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
input[type=text],input[type=number],input[type=month],select,textarea{border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:var(--panel);color:var(--ink)}
input[type=number]{width:58px}
label.chk{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
table{border-collapse:collapse;background:var(--panel)}
th,td{border:1px solid var(--line2);padding:3px 6px;text-align:center;white-space:nowrap}
th{background:var(--panel2);font-weight:700;position:sticky;top:0;z-index:2;font-size:12px;letter-spacing:.02em}
.tblwrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px}
.tog{display:inline-block;min-width:22px;padding:2px 5px;border-radius:5px;border:1px solid var(--line);cursor:pointer;user-select:none;color:var(--na-ink);font-size:12px}
.tog.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.tog.sm{min-width:20px;padding:1px 3px}
td.name{text-align:left;font-weight:700}
td.left{text-align:left}
.badge{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;background:var(--panel2);border:1px solid var(--line2);margin:1px}
.badge.rule{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.badge.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.badge.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
#grid td.cell{cursor:pointer;min-width:78px;padding:0;position:relative;height:30px}
#grid td.cell:hover{outline:2px solid var(--accent);outline-offset:-2px}
#grid td.cell .chip{display:block;padding:5px 6px;font-weight:700;font-size:12.5px}
#grid td.cell.empty{background:var(--bad-bg)}
#grid td.cell.empty::after{content:"未定";color:var(--bad);font-size:11px}
#grid td.cell.na{background:var(--na);cursor:default}
#grid td.cell.na::after{content:"—";color:var(--na-ink)}
#grid td.cell.viol .chip{box-shadow:inset 0 0 0 2px var(--bad)}
#grid td.cell.locked::before{content:"🔒";position:absolute;right:2px;top:1px;font-size:9px}
#grid td.cell.fixed::after{content:"📌";position:absolute;left:2px;top:1px;font-size:9px}
#grid tr.sat td.date{background:var(--sat)}#grid tr.sun td.date{background:var(--sun)}
#grid td.date{font-weight:700;text-align:left;padding-left:8px}
body.ro #grid td.cell{cursor:default}
.popover{position:absolute;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px;min-width:260px;max-height:60vh;overflow:auto}
.popover .ph{font-weight:700;padding:4px 6px;border-bottom:1px solid var(--line);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.popover .opt{padding:5px 8px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.popover .opt:hover{background:var(--accent-soft)}
.popover .opt.ng{color:var(--na-ink)}
.popover .opt .r{font-size:11px;color:var(--bad)}
.popover .opt.ng .r{color:var(--na-ink)}
.popover .opt .cnt{font-size:11px;color:var(--muted)}
.viol{padding:3px 0;border-bottom:1px dashed var(--line2)}
.viol.hard{color:var(--bad)}.viol.soft{color:var(--warn)}
.two{display:grid;grid-template-columns:1fr 380px;gap:14px;align-items:start}
@media (max-width:1100px){.two{grid-template-columns:1fr}}
.small{font-size:11.5px;color:var(--muted)}
.deptchip{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:middle;margin-right:4px}
#progress{display:none;color:var(--accent);font-weight:700}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span i{display:inline-block;width:14px;height:12px;vertical-align:-2px;margin-right:3px;border:1px solid var(--line)}
.reqgrid input{width:44px;text-align:center}
.notice{background:var(--warn-bg);border:1px solid var(--warn);border-radius:8px;padding:8px 12px;margin-bottom:10px;color:var(--warn)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;z-index:99;box-shadow:var(--shadow);max-width:90vw}
ol.small,ul.small{line-height:1.9;padding-left:20px;margin:0}
@media (prefers-reduced-motion: no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}}
#lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
#lock .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px 30px;max-width:380px;width:100%;box-shadow:var(--shadow)}
#lock h1{font-size:18px;margin:0 0 4px}#lock .sub{color:var(--muted);font-size:12px;margin-bottom:18px}
#lock input[type=password]{width:100%;font-size:16px;padding:9px 10px;margin-bottom:10px}
#lock .err{color:var(--bad);font-size:12px;min-height:18px;margin-bottom:6px}
body.locked #root{visibility:hidden}
@media print{header,nav,.no-print{display:none!important}body{background:#fff}main{padding:0;max-width:none}.tblwrap{max-height:none;overflow:visible;border:none}.two{grid-template-columns:1fr}th{position:static}}
</style>
</head>

const KANJI={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
function toNum(s){s=String(s).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));if(/^\d+$/.test(s))return +s;if(KANJI[s]!=null)return KANJI[s];return null;}
const NUMC='[0-9０-９一二三四五六七八九十]+';
function parseMemo(memo){
  const r={min:0,max:null,onlyNth:[],ngNth:[],weekendHayabusa:false,fixed:[]};
  if(!memo)return r;const m=String(memo).replace(/\s/g,'');let x;
  // 「水・土曜日はやぶさ１固定」「月・火曜日ひなた固定」→ 毎週その曜日はその持ち場に固定
  const fx=m.match(/([月火水木金土日][月火水木金土日・,、]*)曜日?(.+?)(?:に|で|を)?固定/);
  if(fx){const dows=[...fx[1].replace(/[・,、]/g,'')].map(c=>DAYS.indexOf(c)).filter(d=>d>=0);const post=fx[2].trim();if(dows.length&&post)r.fixed=dows.map(d=>[d,post]);}
  if(x=m.match(new RegExp('('+NUMC+')回以上('+NUMC+')回未満'))){r.min=toNum(x[1]);r.max=toNum(x[2])-1;}
  else if(x=m.match(new RegExp('('+NUMC+')回以上('+NUMC+')回以下'))){r.min=toNum(x[1]);r.max=toNum(x[2]);}
  else if(x=m.match(new RegExp('月('+NUMC+')回(程度|まで|以内)?'))){r.max=toNum(x[1]);if(x[2]==='程度')r.min=Math.max(0,r.max-1);}
  else if(x=m.match(new RegExp('('+NUMC+')回以上'))){r.min=toNum(x[1]);}
  const nth=m.match(/第([0-9０-９一二三四五１-５・,、]+)(月|火|水|木|金|土|日)曜日?(不可|NG|×|ダメ|以外)?/);
  if(nth){const nums=nth[1].split(/[・,、]/).map(toNum).filter(n=>n);const dow=DAYS.indexOf(nth[2]);const list=nums.map(n=>[n,dow]);if(nth[3]&&nth[3]!=='以外')r.ngNth=list;else r.onlyNth=list;}
  if(/土日どちらかはやぶさ/.test(m))r.weekendHayabusa=true;

}

/* ===================================================================

function daysInMonth(ym){const [y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate();}
function dowOf(ym,d){const [y,m]=ym.split('-').map(Number);return (new Date(y,m-1,d).getDay()+6)%7;}
function nthOf(d){return Math.floor((d-1)/7)+1;}

/* ===================================================================
   適性チェック
=================================================================== */
function staticReason(st,slot){
  if(!st.active)return '無効';
  if(!st.posts.includes(slot.post))return '持ち場×';
  if(state.settings.prefDays==='hard'&&!st.days.includes(slot.dow))return '希望曜日外';
  if(ngDays(st).has(slot.d))return 'NG日';
  const nth=nthOf(slot.d);
  if(st.onlyNth&&st.onlyNth.length&&!st.onlyNth.some(([n,dw])=>n===nth&&dw===slot.dow))return '第'+st.onlyNth.map(x=>x[0]).join('・')+DAYS[st.onlyNth[0][1]]+'のみ';
  if(st.ngNth&&st.ngNth.some(([n,dw])=>n===nth&&dw===slot.dow))return '第'+nth+DAYS[slot.dow]+'不可';
  const wa=waSet();if(wa.size&&slot.post===state.settings.waPost&&isWeekend(slot.dow)&&!wa.has(st.name))return '土日'+slot.post+'対象外';
  return null;

class Sol{

  unset(key){const sid=this.map[key];if(!sid)return;delete this.map[key];const s=slotFromKey(key);const dl=this.byDay.get(s.d);if(dl)this.byDay.set(s.d,dl.filter(x=>x.key!==key));const sl=this.byStaff.get(sid);if(sl)this.byStaff.set(sid,sl.filter(x=>x.key!==key));}
  day(d){return this.byDay.get(d)||[];}of(sid){return this.byStaff.get(sid)||[];}
}
function dynamicReason(st,slot,sol,ignoreKey){
  const S=state.settings,ym=mk();const mine=sol.of(st.id).filter(x=>x.key!==ignoreKey);
  if(mine.some(x=>x.d===slot.d))return '同日重複';
  if(S.deptRule&&st.dept&&!deptExemptSet().has(st.dept)){for(const o of sol.day(slot.d)){if(o.key===ignoreKey||o.sid===st.id)continue;const os=staffById(o.sid);if(os&&os.dept===st.dept)return '同部署('+os.name+')';}}
  if(!st.weeklyExempt){const w=weekOf(ym,slot.d);const c=mine.filter(x=>weekOf(ym,x.d)===w).length;if(c>=S.weekMax)return '週'+S.weekMax+'回超';}
  if(S.consecutive==='hard'){if(mine.some(x=>Math.abs(x.d-slot.d)===1))return '連泊';if(slot.d===1&&prevLastNames().has(st.name))return '連泊(前月末)';}
  if(st.max!=null&&mine.length>=st.max)return '月'+st.max+'回超';

=================================================================== */
function computeTargets(slots){
  const t={};const weeks=weekCount(mk());const elig={};for(const s of state.staff)elig[s.id]=0;
  for(const sl of slots)for(const s of state.staff)if(!staticReason(s,sl))elig[s.id]++;
  const S=slots.length;let fixed=0;const flex=[];
  for(const s of state.staff){if(!s.active||elig[s.id]===0){t[s.id]=0;continue;}
    if(s.fixed&&s.fixed.length){const ng=ngDays(s);t[s.id]=slots.filter(sl=>!ng.has(sl.d)&&sl.idx===0&&s.fixed.some(([dw,p])=>dw===sl.dow&&p===sl.post)).length;fixed+=t[s.id];continue;}
    const cap=Math.min(elig[s.id],s.weeklyExempt?99:weeks*state.settings.weekMax,s.max==null?99:s.max);
    if(s.max!=null&&s.min>=s.max){t[s.id]=Math.min(s.max,cap);fixed+=t[s.id];}else flex.push({s,cap});}
  let remain=S-fixed;let pool=flex.slice();
  for(let it=0;it<4&&pool.length;it++){const share=remain/pool.length;const keep=[];for(const f of pool){const v=Math.min(share,f.cap);if(v<share-1e-9){t[f.s.id]=v;remain-=v;}else keep.push(f);}if(keep.length===pool.length){for(const f of keep)t[f.s.id]=share;pool=[];break;}pool=keep;}
  for(const f of pool)if(t[f.s.id]==null)t[f.s.id]=Math.min(f.cap,remain/pool.length);
  for(const s of state.staff)if(t[s.id]==null)t[s.id]=0;return t;
}
function staffPenalty(st,sol,targets){
  const S=state.settings,ym=mk();const mine=sol.of(st.id);const n=mine.length;const t=targets[st.id]||0;let p=0;

    }else{

      const ids=[curSid,sid2];const before=affected(ids);sol.set(sl.key,sid2);sol.set(sl2.key,curSid);

    if(st.ngNth&&st.ngNth.length)badges.push(h('span',{class:'badge rule'},'第'+st.ngNth.map(x=>x[0]).join('・')+DAYS[st.ngNth[0][1]]+'不可'));
    if(st.weekendHayabusa)badges.push(h('span',{class:'badge rule'},'土日1回はやぶさ'));
    if(st.fixed&&st.fixed.length)badges.push(h('span',{class:'badge rule',title:'毎週この曜日はこの持ち場に固定（NG日は除く）'},'📌固定 '+fixedLabel(st)));
    tr.appendChild(h('td',{class:'left'},h('input',{type:'text',value:st.memo,style:'width:200px',onchange:e=>{st.memo=e.target.value;const r=parseMemo(st.memo);Object.assign(st,{min:r.min,max:r.max,onlyNth:r.onlyNth,ngNth:r.ngNth,weekendHayabusa:r.weekendHayabusa,fixed:r.fixed.map(([d,p])=>[d,resolvePost(p,st.sex)])});up();}}),' ',...badges));
    tr.appendChild(h('td',{},h('button',{class:'btn danger',style:'padding:2px 8px',onclick:()=>{if(confirm(`${st.name||'この行'} を削除しますか？`)){state.staff=state.staff.filter(x=>x.id!==st.id);up();}}},'削除')));
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);
}
function renderRules(){
  const S=state.settings;const tbl=$('#postTable');tbl.innerHTML='';
  tbl.appendChild(h('thead',{},h('tr',{},h('th',{},'持ち場'),...DAYS.map(d=>h('th',{},d)),h('th',{},'候補者数(月/火/…/日)'),h('th',{},''))));
  const tb=h('tbody');
  state.posts.forEach((p,i)=>{const tr=h('tr');
    tr.appendChild(h('td',{},h('input',{type:'text',value:p.name,style:'width:120px',onchange:e=>{const nn=e.target.value.trim();if(!nn||nn===p.name)return;for(const st of state.staff)st.posts=st.posts.map(x=>x===p.name?nn:x);if(S.waPost===p.name)S.waPost=nn;p.name=nn;changed();renderAll();}})));
    DAYS.forEach((d,di)=>tr.appendChild(h('td',{},h('input',{type:'number',min:0,max:5,value:p.req[di]||0,onchange:e=>{p.req[di]=+e.target.value||0;changed();}}))));
    tr.appendChild(h('td',{class:'small'},DAYS.map((d,di)=>state.staff.filter(s=>s.active&&s.posts.includes(p.name)&&s.days.includes(di)).length).join(' / ')));
    tr.appendChild(h('td',{},h('button',{class:'btn danger',style:'padding:2px 8px',onclick:()=>{if(confirm(`持ち場「${p.name}」を削除しますか？`)){state.posts.splice(i,1);changed();renderAll();}}},'削除')));
    tb.appendChild(tr);});
  tbl.appendChild(tb);
  $('#deptRule').checked=!!S.deptRule;$('#deptExempt').value=S.deptExempt;$('#weekMax').value=S.weekMax;$('#consecutive').value=S.consecutive;$('#prefDays').value=S.prefDays;
  const sel=$('#waPost');sel.innerHTML='';state.posts.forEach(p=>sel.appendChild(h('option',{value:p.name},p.name)));sel.value=S.waPost;$('#waNames').value=S.waNames;$('#minGap').value=S.minGap;$('#fairWeekend').checked=!!S.fairWeekend;
}
function bindRules(){
  const b=(id,fn)=>$(id).addEventListener('change',e=>{fn(e.target,state.settings);changed();});
  b('#deptRule',(t,S)=>S.deptRule=t.checked);b('#deptExempt',(t,S)=>S.deptExempt=t.value);b('#weekMax',(t,S)=>S.weekMax=Math.max(1,+t.value||2));
  b('#consecutive',(t,S)=>S.consecutive=t.value);b('#prefDays',(t,S)=>S.prefDays=t.value);b('#waPost',(t,S)=>S.waPost=t.value);b('#waNames',(t,S)=>S.waNames=t.value);
  b('#minGap',(t,S)=>S.minGap=Math.max(1,+t.value||1));b('#fairWeekend',(t,S)=>S.fairWeekend=t.checked);
  $('#btnAddPost').onclick=()=>{const nm=$('#newPost').value.trim();if(!nm||state.posts.some(p=>p.name===nm))return;state.posts.push({name:nm,req:[1,1,1,1,1,1,1]});$('#newPost').value='';changed();renderAll();};
}

/* ===================================================================
   ファイル入出力
=================================================================== */
async function deliver(filename,data){
  if(dl){try{await dl.save({filename,data});toast('保存しました');}catch(e){if(e&&e.code==='declined')return;toast('保存できませんでした：'+(e&&e.message||e));}return;}
  const blob=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(blob);const a=h('a',{href:u,download:filename});document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
}
function exportXlsx(){
  const ym=mk(),n=daysInMonth(ym);const [Y,Mo]=ym.split('-');const a=A();const chk=checkAll();
  const cols=[];for(const p of state.posts){const mx=Math.max(...p.req);for(let i=0;i<mx;i++)cols.push({post:p.name,idx:i,label:mx>1?`${p.name}${i+1}`:p.name});}
  const sh1=[[`${Y}年${+Mo}月 泊まり表`],['日','曜',...cols.map(c=>c.label)]];
  for(let d=1;d<=n;d++){const dow=dowOf(ym,d);const row=[d,DAYS[dow]];for(const c of cols){const p=state.posts.find(x=>x.name===c.post);if((p.req[dow]||0)<=c.idx){row.push('—');continue;}const st=staffById(a[d+'|'+c.post+'|'+c.idx]);row.push(st?st.name:'未定');}sh1.push(row);}
  const sh2=[['氏名','所属','性別',...Array.from({length:n},(_,i)=>i+1),'回数']];
  for(const st of state.staff.filter(s=>s.active)){const mine=chk.sol.of(st.id);const row=[st.name,st.dept,st.sex];for(let d=1;d<=n;d++){const x=mine.find(m=>m.d===d);row.push(x?x.post:'');}row.push(mine.length);sh2.push(row);}
  const wk=weekCount(ym);const targets=computeTargets(chk.slots);
  const sh3=[['氏名','所属','性別','回数','目標','最小','最大','土日回数',...Array.from({length:wk},(_,i)=>`第${i+1}週`),'備考']];
  for(const st of state.staff.filter(s=>s.active)){const mine=chk.sol.of(st.id);const wc=Array.from({length:wk},()=>0);for(const x of mine)wc[weekOf(ym,x.d)]++;sh3.push([st.name,st.dept,st.sex,mine.length,+(targets[st.id]||0).toFixed(1),st.min||0,st.max==null?'':st.max,mine.filter(x=>isWeekend(x.dow)).length,...wc,st.memo]);}
  const sh4=[['種別','内容']];for(const v of chk.out)sh4.push([v.t==='hard'?'必須違反':'要確認',v.m]);
  if(typeof XLSX==='undefined'){deliver(`泊まり表_${Y}${Mo}.csv`,'﻿'+sh1.map(r=>r.join(',')).join('\n'));toast('Excel部品が読み込めなかったためCSVで出力します');return;}
  const wb=XLSX.utils.book_new();
  const w1=XLSX.utils.aoa_to_sheet(sh1);w1['!cols']=[{wch:4},{wch:4},...cols.map(()=>({wch:12}))];XLSX.utils.book_append_sheet(wb,w1,'泊まり表');
  const w2=XLSX.utils.aoa_to_sheet(sh2);w2['!cols']=[{wch:10},{wch:9},{wch:4},...Array.from({length:n},()=>({wch:7})),{wch:5}];XLSX.utils.book_append_sheet(wb,w2,'個人別');
  const w3=XLSX.utils.aoa_to_sheet(sh3);w3['!cols']=[{wch:10},{wch:9},{wch:4},{wch:5},{wch:5},{wch:5},{wch:5},{wch:7},...Array.from({length:wk},()=>({wch:6})),{wch:30}];XLSX.utils.book_append_sheet(wb,w3,'集計');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sh4),'チェック');
  deliver(`泊まり表_${Y}${Mo}.xlsx`,XLSX.write(wb,{type:'array',bookType:'xlsx'}));
}
function importStaffXlsx(file){
  if(typeof XLSX==='undefined'){toast('Excel部品が読み込めません。インターネット接続を確認してください。');return;}
  const rd=new FileReader();rd.onload=e=>{
    const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
    const mark=v=>v!=null&&['〇','◯','○','●','O','o','1'].includes(String(v).trim());const found=[];
    for(let r=0;r<rows.length;r++){const row=rows[r];if(!row||String(row[0]||'').trim()!=='氏名')continue;const hdr=row.map(v=>v==null?'':String(v).trim());const iSex=hdr.indexOf('性別'),iMon=hdr.indexOf('月');if(iSex<0||iMon<0)continue;
      const posts=hdr.slice(iSex+1,iMon);const iMemo=iMon+7;
      for(let k=r+1;k<rows.length;k++){const dr=rows[k];if(!dr||dr[0]==null||String(dr[0]).trim()===''||String(dr[0]).trim()==='氏名')break;
        found.push({name:String(dr[0]).trim(),dept:dr[1]==null?'':String(dr[1]).trim(),sex:dr[iSex]==null?'男':String(dr[iSex]).trim(),posts:posts.filter((p,j)=>mark(dr[iSex+1+j])),days:DAYS.filter((d,j)=>mark(dr[iMon+j])),memo:dr[iMemo]==null?'':String(dr[iMemo]).trim()});}}
    if(!found.length){toast('「氏名」で始まる表が見つかりませんでした。');return;}
    if(!confirm(`${found.length}人分を読み込みます。現在のスタッフ表を置き換えますか？\n（NG日・作成済みの泊まり表はそのまま残ります）`))return;
    state.staff=found.map((o,i)=>{const old=state.staff.find(x=>x.name===o.name);return normalizeStaff({...o,id:old?old.id:uid(),order:i,weeklyExempt:old?old.weeklyExempt:undefined});});
    const added=[];for(const s of state.staff)for(const p of s.posts)if(!state.posts.some(x=>x.name===p)){state.posts.push({name:p,req:[0,0,0,0,0,0,0]});added.push(p);}
    changed();renderAll();toast('読み込みました。'+(added.length?`新しい持ち場「${added.join('・')}」を必要人数0で追加しました。`:'')+' 右上の保存を押すと全員に反映されます。');
  };rd.readAsArrayBuffer(file);
}

   イベント
=================================================================== */
function switchTab(name){document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));document.querySelectorAll('section.tab').forEach(s=>s.classList.toggle('active',s.id==='tab-'+name));}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{switchTab(b.dataset.tab);ss('tomari:tab',b.dataset.tab);renderAll();});
$('#month').onchange=e=>{if(!e.target.value)return;state.month=e.target.value;ss('tomari:month',state.month);renderMake();};
$('#prevLast').onchange=e=>{M().prevLast=e.target.value;changed();renderMake();};
$('#btnSave').onclick=saveAll;
function runGen(keep){
  if(readOnly){toast('このページは閲覧のみです。');return;}
  if(!state.staff.length){toast('スタッフ表が空です。');return;}
  const hasAny=Object.keys(A()).some(k=>A()[k]&&!(keep&&L()[k]));
  if(hasAny&&!confirm(keep?'🔒固定以外のセルを作り直します。よろしいですか？':'現在の泊まり表を消して作り直します。よろしいですか？'))return;
  $('#progress').style.display='inline';$('#btnGen').disabled=$('#btnRegen').disabled=true;
  setTimeout(()=>{try{const res=solve(+$('#budget').value,keep);const m=M();m.assign=res.sol?{...res.sol.map}:{};if(!keep)m.locks={};changed();renderMake();}
    finally{$('#progress').style.display='none';$('#btnGen').disabled=$('#btnRegen').disabled=false;}},30);
}
$('#btnGen').onclick=()=>runGen(false);$('#btnRegen').onclick=()=>runGen(true);
$('#btnClear').onclick=()=>{if(readOnly)return;if(confirm('この月の泊まり表と🔒固定を全て消します。よろしいですか？')){const m=M();m.assign={};m.locks={};changed();renderMake();}};
$('#btnXlsx').onclick=exportXlsx;$('#btnPrint').onclick=()=>window.print();
$('#btnAddStaff').onclick=()=>{if(readOnly){toast('このページは閲覧のみです。');return;}state.staff.unshift(normalizeStaff({name:'',dept:'',sex:'男',posts:[],days:[],memo:'',order:-1}));changed();renderStaff();};
$('#btnImportXlsx').onclick=()=>{if(readOnly){toast('このページは閲覧のみです。');return;}$('#fileXlsx').click();};$('#fileXlsx').onchange=e=>{if(e.target.files[0])importStaffXlsx(e.target.files[0]);e.target.value='';};
$('#btnSaveJson').onclick=()=>deliver(`泊まり表バックアップ_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(snapshot(),null,1));
$('#btnLoadJson').onclick=()=>{if(readOnly){toast('このページは閲覧のみです。');return;}$('#fileJson').click();};
$('#fileJson').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=ev=>{try{const s=JSON.parse(ev.target.result);if(!s.staff||!s.posts)throw 0;
  if(!confirm('バックアップの内容で現在のデータ（スタッフ表・条件・各月の泊まり表）を置き換えますか？'))return;
  applyLoaded(s);changed();renderAll();toast('復元しました。右上の保存を押すと全員に反映されます。');}catch(x){toast('読み込めませんでした。');}};rd.readAsText(f);e.target.value='';};
bindRules();boot();
</script>
