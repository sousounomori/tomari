<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>【お試し版】泊まり表メーカー</title>
<style id="css">
:root{
  color-scheme:light;
  --bg:#f2f4f7;--panel:#ffffff;--panel2:#f7f9fb;--ink:#1a2233;--muted:#66717f;--line:#d6dce4;--line2:#e7ebf0;
  --accent:#3a4da6;--accent-hover:#2f3f8c;--accent-ink:#ffffff;--accent-soft:#e8ebf8;
  --ok:#2b7a4b;--ok-bg:#dff3e6;--warn:#8a5a0a;--warn-bg:#fbeccb;--bad:#c4403f;--bad-bg:#fbe3e2;
  --sat:#e4edf9;--sun:#f9e6e4;--na:#eef1f5;--na-ink:#b4bcc7;--shadow:0 12px 32px rgba(20,30,60,.16);
  --chip-s:62%;--chip-l:87%;--chip-ink-s:50%;--chip-ink-l:28%;--focus:#3a4da6;--mine:#f4c542;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#141922;--panel:#1d242f;--panel2:#232b38;--ink:#e6eaf1;--muted:#98a3b3;--line:#323c4b;--line2:#2a333f;
    --accent:#8d9df0;--accent-hover:#a5b2f5;--accent-ink:#0f1424;--accent-soft:#2a3354;
    --ok:#7fd39c;--ok-bg:#1d3a2a;--warn:#f0c264;--warn-bg:#3d3113;--bad:#f28b8a;--bad-bg:#47252a;
    --sat:#1f2b40;--sun:#3d2528;--na:#1a212b;--na-ink:#4a5565;--shadow:0 12px 32px rgba(0,0,0,.5);
    --chip-s:38%;--chip-l:26%;--chip-ink-s:60%;--chip-ink-l:82%;--focus:#a5b2f5;--mine:#e0b43a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141922;--panel:#1d242f;--panel2:#232b38;--ink:#e6eaf1;--muted:#98a3b3;--line:#323c4b;--line2:#2a333f;
  --accent:#8d9df0;--accent-hover:#a5b2f5;--accent-ink:#0f1424;--accent-soft:#2a3354;
  --ok:#7fd39c;--ok-bg:#1d3a2a;--warn:#f0c264;--warn-bg:#3d3113;--bad:#f28b8a;--bad-bg:#47252a;
  --sat:#1f2b40;--sun:#3d2528;--na:#1a212b;--na-ink:#4a5565;--shadow:0 12px 32px rgba(0,0,0,.5);
  --chip-s:38%;--chip-l:26%;--chip-ink-s:60%;--chip-ink-l:82%;--focus:#a5b2f5;--mine:#e0b43a;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:13px;line-height:1.5;color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
header{background:var(--panel);padding:18px 20px 10px;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;min-height:64px}
.toolbar{background:var(--panel);border-bottom:1px solid var(--line);padding:6px 20px 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.04em}
header .sub{color:var(--muted);font-size:12px;margin-top:1px}
.savebar{display:inline-flex;align-items:center;gap:8px;font-size:12px}
.savebar .dirty{color:var(--warn);font-weight:700}
.savebar .ro{color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.savebar .saved{color:var(--muted)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
.toolbar .savebar{margin-left:auto}
nav.tabs button{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px}
nav.tabs button:hover{background:var(--accent-soft)}
nav.tabs button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
main{padding:14px 20px 60px;max-width:1640px;margin:0 auto}
section.tab{display:none}section.tab.active{display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.panel h2{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:10px;font-weight:700;flex-wrap:wrap}
.panel h2 .hint{font-weight:400;color:var(--muted);font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:7px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.primary:hover{background:var(--accent-hover)}
.btn.save{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:700}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.icon{padding:5px 9px}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{background:var(--panel)}
input[type=text],input[type=number],input[type=month],input[type=password],select,textarea{border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:var(--panel);color:var(--ink)}
input[type=number]{width:58px}
label.chk{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
table{border-collapse:collapse;background:var(--panel)}
th,td{border:1px solid var(--line2);padding:3px 6px;text-align:center;white-space:nowrap}
th{background:var(--panel2);font-weight:700;position:sticky;top:0;z-index:2;font-size:12px;letter-spacing:.02em}
.tblwrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px}
.tog{display:inline-block;min-width:22px;padding:2px 5px;border-radius:5px;border:1px solid var(--line);cursor:pointer;user-select:none;color:var(--na-ink);font-size:12px;background:var(--panel)}
.tog.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.tog.sm{min-width:20px;padding:1px 3px}
td.name{text-align:left;font-weight:700}
td.left{text-align:left}
.badge{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;background:var(--panel2);border:1px solid var(--line2);margin:1px}
.badge.rule{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.badge.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.badge.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.monthnav{display:inline-flex;align-items:center;gap:4px}
#grid td.cell{cursor:pointer;min-width:78px;padding:0;position:relative;height:30px}
#grid td.cell:hover{outline:2px solid var(--accent);outline-offset:-2px}
#grid td.cell .chip{display:block;padding:5px 6px;font-weight:700;font-size:12.5px;pointer-events:none}
#grid td.cell.empty{background:var(--bad-bg)}
#grid td.cell.empty::after{content:"未定";color:var(--bad);font-size:11px}
#grid td.cell.na{background:var(--na);cursor:default}
#grid td.cell.na:hover{outline:none}
#grid td.cell.na::after{content:"—";color:var(--na-ink)}
#grid td.cell.viol .chip{box-shadow:inset 0 0 0 2px var(--bad)}
#grid td.cell.mine .chip{box-shadow:inset 0 0 0 3px var(--mine)}
#grid td.cell.locked::before{content:"🔒";position:absolute;right:2px;top:1px;font-size:9px;pointer-events:none}
#grid td.cell.fixed::after{content:"📌";position:absolute;left:2px;top:1px;font-size:9px;pointer-events:none}
#grid tr.sat td.date{background:var(--sat)}#grid tr.sun td.date{background:var(--sun)}
#grid td.date{font-weight:700;text-align:left;padding-left:8px}
body.ro #grid td.cell{cursor:default}
.popover{position:absolute;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px;min-width:270px;max-height:60vh;overflow:auto}
.popover .ph{font-weight:700;padding:4px 6px;border-bottom:1px solid var(--line);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.popover .opt{padding:5px 8px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.popover .opt>*{pointer-events:none}
.popover .opt:hover{background:var(--accent-soft)}
.popover .opt.ng{color:var(--na-ink)}
.popover .opt .r{font-size:11px;color:var(--bad)}
.popover .opt.ng .r{color:var(--na-ink)}
.popover .opt .cnt{font-size:11px;color:var(--muted)}
.viol{padding:3px 0;border-bottom:1px dashed var(--line2)}
.viol.clickable{cursor:pointer}
.viol.hard{color:var(--bad)}.viol.soft{color:var(--warn)}
.two{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
@media (max-width:1100px){.two{grid-template-columns:minmax(0,1fr)}}
.small{font-size:11.5px;color:var(--muted)}
.deptchip{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:middle;margin-right:4px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span i{display:inline-block;width:14px;height:12px;vertical-align:-2px;margin-right:3px;border:1px solid var(--line)}
.reqgrid input{width:44px;text-align:center}
.notice{background:var(--warn-bg);border:1px solid var(--warn);border-radius:8px;padding:8px 12px;margin-bottom:10px;color:var(--warn)}
.progress{display:none;align-items:center;gap:8px;color:var(--accent);font-weight:700}
.progress.on{display:inline-flex}
.progress .bar{width:120px;height:6px;border-radius:3px;background:var(--line2);overflow:hidden}
.progress .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.mylist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mylist .d{border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--panel2);font-size:12px}
.mylist .d b{margin-right:4px}
.mylist .d.we{background:var(--sat)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;z-index:99;box-shadow:var(--shadow);max-width:90vw}
ol.small,ul.small{line-height:1.9;padding-left:20px;margin:0}
.modal-ov{position:fixed;inset:0;background:rgba(10,14,24,.5);z-index:120;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px;max-width:440px;width:100%;box-shadow:var(--shadow)}
.modal p{margin:0 0 16px;white-space:pre-line;line-height:1.7;font-size:14px}
.trial{background:#fff3c4;color:#5a3d00;border-bottom:3px solid #e0a800;padding:14px 20px}
.trial .t1{font-size:22px;font-weight:700;letter-spacing:.06em;margin:0 0 4px}
.trial .t1 span{display:inline-block;background:#e0a800;color:#fff;border-radius:8px;padding:2px 12px;margin-right:10px}
.trial ul{margin:4px 0 0;padding-left:20px;font-size:13.5px;line-height:1.8}
.trial b{color:#a33a00}
.trial-tag{background:#e0a800;color:#fff;border-radius:999px;padding:3px 12px;font-weight:700;font-size:12px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .trial{background:#3d3113;color:#f5e2b0;border-color:#c79300}:root:not([data-theme="light"]) .trial b{color:#ffb27a}}
@media print{.trial{display:none!important}}
#lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
#lock .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px 30px;max-width:380px;width:100%;box-shadow:var(--shadow)}
#lock h1{font-size:18px;margin:0 0 4px}#lock .sub{color:var(--muted);font-size:12px;margin-bottom:18px}
#lock input[type=password]{width:100%;font-size:16px;padding:9px 10px;margin-bottom:10px}
#lock .err{color:var(--bad);font-size:12px;min-height:18px;margin-bottom:6px}
body.locked #root{visibility:hidden}
@media (prefers-reduced-motion: no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}}
@media (max-width:700px){main{padding:10px 8px 40px}header{padding:14px 10px 6px}.toolbar{padding:6px 10px 8px}.toolbar .savebar{margin-left:0}}
@page{size:A4 landscape;margin:8mm}
@media print{
  header,.toolbar,nav,.no-print{display:none!important}
  body{background:#fff;color:#000;font-size:10px}
  main{padding:0;max-width:none}
  .panel{border:none;padding:0;margin:0 0 6px}
  .tblwrap{max-height:none;overflow:visible;border:none}
  .two{display:block}.two>div:last-child{display:none}
  th{position:static}
  #grid td.cell{min-width:0;height:auto}
  #grid td.cell .chip{padding:2px 3px;font-size:10px;background:none!important;color:#000!important;box-shadow:none!important}
  #grid td.cell.empty{background:#fff}
  #grid td.cell::before,#grid td.cell::after{display:none}
  .sumpanel{break-before:page}
}
</style>

const KANJI={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
function toNum(s){s=String(s).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));if(/^\d+$/.test(s))return +s;if(KANJI[s]!=null)return KANJI[s];return null;}

function parseMemo(memo){
  const r={min:0,max:null,onlyNth:[],ngNth:[],weekendHayabusa:false,fixed:[]};
  if(!memo)return r;const m=String(memo).replace(/\s/g,'');let x;
  const fx=m.match(/([月火水木金土日][月火水木金土日・,、]*)曜日?(.+?)(?:に|で|を)?固定/);
  if(fx){const dows=[...fx[1].replace(/[・,、]/g,'')].map(c=>DAYS.indexOf(c)).filter(d=>d>=0);const post=fx[2].trim();if(dows.length&&post)r.fixed=dows.map(d=>[d,post]);}
  if(x=m.match(new RegExp('('+NUMC+')回以上('+NUMC+')回未満'))){r.min=toNum(x[1]);r.max=toNum(x[2])-1;}
  else if(x=m.match(new RegExp('('+NUMC+')回以上('+NUMC+')回以下'))){r.min=toNum(x[1]);r.max=toNum(x[2]);}
  else if(x=m.match(new RegExp('月('+NUMC+')回(程度|まで|以内)?'))){r.max=toNum(x[1]);if(x[2]==='程度')r.min=Math.max(0,r.max-1);}
  else if(x=m.match(new RegExp('('+NUMC+')回以上'))){r.min=toNum(x[1]);}
  const nth=m.match(/第([0-9０-９一二三四五１-５・,、]+)(月|火|水|木|金|土|日)曜日?(不可|NG|×|ダメ|以外)?/);
  if(nth){const nums=nth[1].split(/[・,、]/).map(toNum).filter(n=>n);const dow=DAYS.indexOf(nth[2]);const list=nums.map(n=>[n,dow]);if(nth[3]&&nth[3]!=='以外')r.ngNth=list;else r.onlyNth=list;}
  if(/土日どちらかはやぶさ/.test(m))r.weekendHayabusa=true;
  return r;
}

  for(const c of cands){if(sex==='女'&&c==='はやぶさ')return FEMALE_HAYABUSA;if(names.includes(c))return c;}

}

  return {id:o.id||uid(),name:o.name||'',dept:o.dept||'',sex:o.sex||'男',posts,
    days:(o.days||[]).map(d=>typeof d==='number'?d:DAYS.indexOf(d)).filter(d=>d>=0),memo:o.memo||'',
    min:o.min!=null?o.min:r.min,max:o.max!==undefined?o.max:r.max,onlyNth:o.onlyNth||r.onlyNth,ngNth:o.ngNth||r.ngNth,
    weekendHayabusa:o.weekendHayabusa!=null?o.weekendHayabusa:r.weekendHayabusa,
    fixed:r.fixed.map(([d,p])=>[d,resolvePost(p,o.sex)]),

async function decryptState(b64,pass){

  return '<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>'+Y+'年'+(+Mo)+'月 泊まり表</title><style>@page{size:A4 landscape;margin:8mm}body{font-family:"Yu Gothic UI","Meiryo","Hiragino Sans",sans-serif;font-size:10.5px;color:#000;margin:0}h1{font-size:15px;margin:0 0 6px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #888;padding:2px 3px;text-align:center;white-space:nowrap}th{background:#eee}tr.sat td:nth-child(-n+2){background:#e4edf9}tr.sun td:nth-child(-n+2){background:#f9e6e4}.na{background:#f2f2f2;color:#aaa}.empty{color:#c00}</style></head><body>'
    +'<h1>'+Y+'年'+(+Mo)+'月 泊まり表　社会福祉法人そうそうの杜</h1><table>'+body+'</table><script>window.addEventListener("load",function(){setTimeout(function(){print();},300);});<\/script></body></html>';
}

let toastTimer=null;
function toast(msg){let t=document.querySelector('.toast');if(!t){t=h('div',{class:'toast',role:'status'});document.body.appendChild(t);}t.textContent=msg;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),4500);}

/* ===================================================================
   日付
=================================================================== */
function daysInMonth(ym){const [y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate();}
function dowOf(ym,d){const [y,m]=ym.split('-').map(Number);return (new Date(y,m-1,d).getDay()+6)%7;}
function nthOf(d){return Math.floor((d-1)/7)+1;}
function weekOf(ym,d){return Math.floor((d-1+dowOf(ym,1))/7);}
function weekCount(ym){return weekOf(ym,daysInMonth(ym))+1;}
function isWeekend(dow){return dow>=5;}
function shiftMonth(ym,delta){let [y,m]=ym.split('-').map(Number);m+=delta;while(m<1){m+=12;y--;}while(m>12){m-=12;y++;}return y+'-'+String(m).padStart(2,'0');}
function ngDays(st){const s=NG()[st.id]||'';return new Set(String(s).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).split(/[^\d]+/).filter(Boolean).map(Number));}
/* 前月の表があれば、その最終日に泊まった人を自動で求める */
function autoPrevLast(){
  const pm=shiftMonth(mk(),-1);const pmo=state.months[pm];if(!pmo||!pmo.assign)return [];
  const last=daysInMonth(pm);const ids=new Set();for(const k in pmo.assign){if(+k.split('|')[0]===last&&pmo.assign[k])ids.add(pmo.assign[k]);}
  return [...ids].map(id=>staffById(id)).filter(Boolean).map(s=>s.name);
}
function prevLastNames(){const manual=String(M().prevLast||'').split(/[,、，\s]+/).filter(Boolean);return new Set(manual.length?manual:autoPrevLast());}
function buildSlots(){const ym=mk(),n=daysInMonth(ym),slots=[];for(let d=1;d<=n;d++){const dow=dowOf(ym,d);for(const p of state.posts){const req=p.req[dow]||0;for(let i=0;i<req;i++)slots.push({key:d+'|'+p.name+'|'+i,d,dow,post:p.name,idx:i});}}return slots;}
function slotFromKey(key){const [d,post,idx]=key.split('|');const dd=+d;return {key,d:dd,dow:dowOf(mk(),dd),post,idx:+idx};}
function staffById(id){return state.staff.find(s=>s.id===id);}
function splitList(s){return String(s||'').split(/[,、，\s]+/).filter(Boolean);}
function deptExemptSet(){return new Set(splitList(state.settings.deptExempt));}
function waSet(){return new Set(splitList(state.settings.waNames));}

/* ===================================================================
   適性チェック
=================================================================== */
function staticReason(st,slot){
  if(!st.active)return '無効';
  if(!st.posts.includes(slot.post))return '持ち場×';
  if(state.settings.prefDays==='hard'&&!st.days.includes(slot.dow))return '希望曜日外';
  if(ngDays(st).has(slot.d))return 'NG日';
  const nth=nthOf(slot.d);
  if(st.onlyNth&&st.onlyNth.length&&!st.onlyNth.some(([n,dw])=>n===nth&&dw===slot.dow))return '第'+st.onlyNth.map(x=>x[0]).join('・')+DAYS[st.onlyNth[0][1]]+'のみ';
  if(st.ngNth&&st.ngNth.some(([n,dw])=>n===nth&&dw===slot.dow))return '第'+nth+DAYS[slot.dow]+'不可';
  const wa=waSet();if(wa.size&&slot.post===state.settings.waPost&&isWeekend(slot.dow)&&!wa.has(st.name))return '土日'+slot.post+'対象外';
  return null;
}
class Sol{
  constructor(map){this.map={};this.byDay=new Map();this.byStaff=new Map();if(map)for(const k in map)if(map[k])this.set(k,map[k]);}
  set(key,sid){if(this.map[key])this.unset(key);this.map[key]=sid;const s=slotFromKey(key);if(!this.byDay.has(s.d))this.byDay.set(s.d,[]);this.byDay.get(s.d).push({key,sid,post:s.post});if(!this.byStaff.has(sid))this.byStaff.set(sid,[]);this.byStaff.get(sid).push({key,d:s.d,dow:s.dow,post:s.post});}
  unset(key){const sid=this.map[key];if(!sid)return;delete this.map[key];const s=slotFromKey(key);const dl=this.byDay.get(s.d);if(dl)this.byDay.set(s.d,dl.filter(x=>x.key!==key));const sl=this.byStaff.get(sid);if(sl)this.byStaff.set(sid,sl.filter(x=>x.key!==key));}
  day(d){return this.byDay.get(d)||[];}of(sid){return this.byStaff.get(sid)||[];}
}
/* 固定日どうしの連泊は本人の決まった勤務なので違反にしない */
function consecutiveClash(st,slot,mine){
  const me={dow:slot.dow,post:slot.post};const meFixed=isFixedFor(st,me);
  return mine.some(x=>Math.abs(x.d-slot.d)===1&&!(meFixed&&isFixedFor(st,x)));
}
function dynamicReason(st,slot,sol,ignoreKey){
  const S=state.settings,ym=mk();const mine=sol.of(st.id).filter(x=>x.key!==ignoreKey);
  if(mine.some(x=>x.d===slot.d))return '同日重複';
  if(S.deptRule&&st.dept&&!deptExemptSet().has(st.dept)){for(const o of sol.day(slot.d)){if(o.key===ignoreKey||o.sid===st.id)continue;const os=staffById(o.sid);if(os&&os.dept===st.dept)return '同部署('+os.name+')';}}
  if(!st.weeklyExempt){const w=weekOf(ym,slot.d);const c=mine.filter(x=>weekOf(ym,x.d)===w).length;if(c>=S.weekMax)return '週'+S.weekMax+'回超';}
  if(S.consecutive==='hard'){if(consecutiveClash(st,slot,mine))return '連泊';if(slot.d===1&&prevLastNames().has(st.name)&&!isFixedFor(st,slot))return '連泊(前月末)';}
  if(st.max!=null&&mine.length>=st.max)return '月'+st.max+'回超';
  return null;
}

/* ===================================================================
   目標回数と評価
=================================================================== */
function computeTargets(slots){
  const t={};const weeks=weekCount(mk());const elig={};for(const s of state.staff)elig[s.id]=0;
  for(const sl of slots)for(const s of state.staff)if(!staticReason(s,sl))elig[s.id]++;
  const S=slots.length;let fixed=0;const flex=[];
  for(const s of state.staff){if(!s.active||elig[s.id]===0){t[s.id]=0;continue;}
    if(s.fixed&&s.fixed.length){const ng=ngDays(s);t[s.id]=slots.filter(sl=>!ng.has(sl.d)&&sl.idx===0&&s.fixed.some(([dw,p])=>dw===sl.dow&&p===sl.post)).length;fixed+=t[s.id];continue;}
    const cap=Math.min(elig[s.id],s.weeklyExempt?99:weeks*state.settings.weekMax,s.max==null?99:s.max);
    if(s.max!=null&&s.min>=s.max){t[s.id]=Math.min(s.max,cap);fixed+=t[s.id];}else flex.push({s,cap});}
  let remain=S-fixed;let pool=flex.slice();
  for(let it=0;it<4&&pool.length;it++){const share=remain/pool.length;const keep=[];for(const f of pool){const v=Math.min(share,f.cap);if(v<share-1e-9){t[f.s.id]=v;remain-=v;}else keep.push(f);}if(keep.length===pool.length){for(const f of keep)t[f.s.id]=share;pool=[];break;}pool=keep;}
  for(const f of pool)if(t[f.s.id]==null)t[f.s.id]=Math.min(f.cap,remain/pool.length);
  for(const s of state.staff)if(t[s.id]==null)t[s.id]=0;return t;
}
function staffPenalty(st,sol,targets){
  const S=state.settings,ym=mk();const mine=sol.of(st.id);const n=mine.length;const t=targets[st.id]||0;let p=0;
  const conP=S.consecutive==='soft'?120:(S.consecutive==='hard'?600:0);
  if(n<st.min)p+=(st.min-n)*80;else if(st.max!=null&&n>st.max)p+=(n-st.max)*400;else p+=Math.pow(n-t,2)*12;
  if(n===0&&t>0.5)p+=20;
  const its=mine.slice().sort((a,b)=>a.d-b.d);
  for(let i=1;i<its.length;i++){if(isFixedFor(st,its[i])&&isFixedFor(st,its[i-1]))continue;const g=its[i].d-its[i-1].d;if(g===1)p+=conP;else if(g<S.minGap)p+=(S.minGap-g)*8;}
  if(its.length&&its[0].d===1&&prevLastNames().has(st.name)&&!isFixedFor(st,its[0]))p+=conP;
  if(!st.weeklyExempt){const wc={};for(const x of mine){const w=weekOf(ym,x.d);wc[w]=(wc[w]||0)+1;}for(const w in wc)if(wc[w]>S.weekMax)p+=(wc[w]-S.weekMax)*600;}
  if(S.prefDays==='soft')for(const x of mine)if(!st.days.includes(x.dow))p+=35;
  if(st.weekendHayabusa){const we=mine.filter(x=>isWeekend(x.dow));if(we.length&&!we.some(x=>x.post===FEMALE_HAYABUSA))p+=50;}
  if(S.fairWeekend){const we=mine.filter(x=>isWeekend(x.dow)).length;const weAvail=st.days.filter(isWeekend).length;if(weAvail&&n>0){const ideal=n*weAvail/Math.max(1,st.days.length);p+=Math.pow(we-ideal,2)*4;}}
  return p;
}
function totalScore(sol,slots,targets){let s=0;for(const sl of slots)if(!sol.map[sl.key])s+=1000;for(const st of state.staff)s+=staffPenalty(st,sol,targets);return s;}

/* ===================================================================
   ソルバー（計算中も画面が固まらないよう、少しずつ区切って動かす）
=================================================================== */
function rnd(n){return Math.floor(Math.random()*n);}
const nextTick=()=>new Promise(r=>setTimeout(r,0));
let solveCancel=false;
async function drive(gen){let last=performance.now();for(;;){const r=gen.next();if(r.done)return;if(performance.now()-last>30){await nextTick();last=performance.now();if(solveCancel)return;}}}
async function solveAsync(budgetMs,keepLocked,onProg){
  const slots=buildSlots();const targets=computeTargets(slots);const locks=L();let base={};
  if(keepLocked){const a=A();for(const k in locks)if(locks[k]&&a[k])base[k]=a[k];}
  base=fixedAssignments(slots,base);
  const cands={};for(const sl of slots)cands[sl.key]=state.staff.filter(s=>!staticReason(s,sl));
  const lockedKeys=new Set(Object.keys(base));const t0=performance.now();let best=null,bestScore=Infinity,runs=0;
  while(runs<2||performance.now()-t0<budgetMs){
    if(solveCancel&&best)break;
    runs++;const sol=greedy(slots,cands,base,targets);
    await drive(improveGen(sol,slots,cands,lockedKeys,targets,Math.max(400,budgetMs/5)));
    const sc=totalScore(sol,slots,targets);if(sc<bestScore){bestScore=sc;best=sol;}
    onProg(Math.min(1,(performance.now()-t0)/budgetMs),runs);
    if(bestScore===0)break;await nextTick();
  }
  return {sol:best,score:bestScore,runs};
}
function pickBest(list,sol,targets){let bestV=Infinity,bestS=null;for(const st of list){const n=sol.of(st.id).length;const t=targets[st.id]||0;let v=n<st.min?-2+n/Math.max(1,st.min):(t>0?(n+1)/t:5+n);v+=Math.random()*0.25;if(v<bestV){bestV=v;bestS=st;}}return bestS;}
function greedy(slots,cands,base,targets){const sol=new Sol(base);const order=slots.filter(s=>!base[s.key]).map(s=>({s,k:cands[s.key].length+Math.random()*0.9})).sort((a,b)=>a.k-b.k).map(x=>x.s);
  for(const sl of order){const feas=cands[sl.key].filter(st=>!dynamicReason(st,sl,sol,null));if(!feas.length)continue;sol.set(sl.key,pickBest(feas,sol,targets).id);}return sol;}
function* improveGen(sol,slots,cands,lockedKeys,targets,ms){
  const t0=performance.now();const free=slots.filter(s=>!lockedKeys.has(s.key));if(!free.length)return;
  const pen={};for(const st of state.staff)pen[st.id]=staffPenalty(st,sol,targets);
  const affected=ids=>{let b=0;for(const id of ids)b+=pen[id];return b;};
  const recompute=ids=>{let a=0;for(const id of ids){const st=staffById(id);pen[id]=st?staffPenalty(st,sol,targets):0;a+=pen[id];}return a;};
  let T=60,iter=0;
  while(performance.now()-t0<ms){
    iter++;if(iter%50===0)T=Math.max(2,T*0.93);if(iter%200===0)yield;
    const unfilled=free.filter(s=>!sol.map[s.key]);const sl=(unfilled.length&&Math.random()<0.5)?unfilled[rnd(unfilled.length)]:free[rnd(free.length)];const curSid=sol.map[sl.key];
    if(Math.random()<0.55||!curSid){
      const feas=cands[sl.key].filter(st=>st.id!==curSid&&!dynamicReason(st,sl,sol,sl.key));
      if(!feas.length){if(!curSid)ejection(sl,sol,cands,lockedKeys,targets,pen);continue;}
      const st=feas[rnd(feas.length)];const ids=curSid?[curSid,st.id]:[st.id];const before=affected(ids)+(curSid?0:1000);
      sol.set(sl.key,st.id);const after=recompute(ids);const delta=after-before;
      if(!(delta<=0||Math.random()<Math.exp(-delta/T))){if(curSid)sol.set(sl.key,curSid);else sol.unset(sl.key);recompute(ids);}
    }else{
      const sl2=free[rnd(free.length)];const sid2=sol.map[sl2.key];if(!sid2||sl2.d===sl.d||sid2===curSid)continue;
      const st1=staffById(curSid),st2=staffById(sid2);if(!st1||!st2)continue;if(staticReason(st2,sl)||staticReason(st1,sl2))continue;
      sol.unset(sl.key);sol.unset(sl2.key);
      if(dynamicReason(st2,sl,sol,null)||dynamicReason(st1,sl2,sol,null)){sol.set(sl.key,curSid);sol.set(sl2.key,sid2);continue;}
      const ids=[curSid,sid2];const before=affected(ids);sol.set(sl.key,sid2);sol.set(sl2.key,curSid);
      if(dynamicReason(st2,sl,sol,sl.key)||dynamicReason(st1,sl2,sol,sl2.key)){sol.set(sl.key,curSid);sol.set(sl2.key,sid2);continue;}
      const after=recompute(ids);const delta=after-before;
      if(!(delta<=0||Math.random()<Math.exp(-delta/T))){sol.set(sl.key,curSid);sol.set(sl2.key,sid2);recompute(ids);}
    }
  }
}
function ejection(sl,sol,cands,lockedKeys,targets,pen){
  const list=cands[sl.key].slice().sort(()=>Math.random()-0.5).slice(0,12);
  for(const st of list){const mine=sol.of(st.id);const blockers=mine.filter(x=>x.d===sl.d||Math.abs(x.d-sl.d)===1||weekOf(mk(),x.d)===weekOf(mk(),sl.d));let removed=null;
    if(blockers.length===1&&!lockedKeys.has(blockers[0].key)){removed=blockers[0];sol.unset(removed.key);}else if(blockers.length>1)continue;
    if(dynamicReason(st,sl,sol,null)){if(removed)sol.set(removed.key,st.id);continue;}
    sol.set(sl.key,st.id);
    if(removed){const rs=slotFromKey(removed.key);const feas=cands[removed.key].filter(o=>o.id!==st.id&&!dynamicReason(o,rs,sol,null));
      if(feas.length){const o=pickBest(feas,sol,targets);sol.set(removed.key,o.id);for(const id of [st.id,o.id])pen[id]=staffPenalty(staffById(id),sol,targets);return true;}
      sol.unset(sl.key);sol.set(removed.key,st.id);continue;}
    pen[st.id]=staffPenalty(st,sol,targets);return true;}
  return false;
}

/* ===================================================================
   違反チェック
=================================================================== */
function checkAll(){
  const slots=buildSlots();const sol=new Sol(A());const S=state.settings;const ym=mk();const out=[];const cellBad=new Set();
  for(const sl of slots){const sid=sol.map[sl.key];if(!sid){out.push({t:'hard',m:`${sl.d}日(${DAYS[sl.dow]}) ${sl.post}：未定`,key:sl.key});continue;}
    const st=staffById(sid);if(!st){out.push({t:'hard',m:`${sl.d}日 ${sl.post}：不明なスタッフ`,key:sl.key});cellBad.add(sl.key);continue;}
    const r=staticReason(st,sl);if(r){out.push({t:'hard',m:`${sl.d}日(${DAYS[sl.dow]}) ${sl.post} ${st.name}：${r}`,key:sl.key});cellBad.add(sl.key);}}
  for(const [d,list] of sol.byDay){const seen={};for(const x of list){if(seen[x.sid]){out.push({t:'hard',m:`${d}日：${staffById(x.sid)?.name} が同日に2箇所`,key:x.key});cellBad.add(x.key);cellBad.add(seen[x.sid]);}seen[x.sid]=x.key;}
    if(S.deptRule){const ex=deptExemptSet();const byDept={};for(const x of list){const st=staffById(x.sid);if(!st||!st.dept||ex.has(st.dept))continue;(byDept[st.dept]=byDept[st.dept]||[]).push(x);}
      for(const dp in byDept)if(byDept[dp].length>1){out.push({t:'hard',m:`${d}日：同部署「${dp}」が${byDept[dp].length}人（${byDept[dp].map(x=>staffById(x.sid).name).join('・')}）`,key:byDept[dp][0].key});byDept[dp].forEach(x=>cellBad.add(x.key));}}}
  for(const st of state.staff){const mine=sol.of(st.id);if(!mine.length){if(st.active&&st.min>0)out.push({t:'soft',m:`${st.name}：最小${st.min}回に未達（0回）`});continue;}
    const ds=mine.slice().sort((a,b)=>a.d-b.d);const hardC=S.consecutive==='hard';
    for(let i=1;i<ds.length;i++)if(ds[i].d-ds[i-1].d===1&&S.consecutive!=='off'&&!(isFixedFor(st,ds[i])&&isFixedFor(st,ds[i-1]))){out.push({t:hardC?'hard':'soft',m:`${st.name}：${ds[i-1].d}日→${ds[i].d}日 連泊`,key:ds[i].key});if(hardC){cellBad.add(ds[i].key);cellBad.add(ds[i-1].key);}}
    if(ds[0].d===1&&prevLastNames().has(st.name)&&S.consecutive!=='off'&&!isFixedFor(st,ds[0])){out.push({t:hardC?'hard':'soft',m:`${st.name}：前月末→1日 連泊`,key:ds[0].key});if(hardC)cellBad.add(ds[0].key);}
    if(!st.weeklyExempt){const wc={};for(const x of mine){const w=weekOf(ym,x.d);(wc[w]=wc[w]||[]).push(x);}for(const w in wc)if(wc[w].length>S.weekMax){out.push({t:'hard',m:`${st.name}：第${+w+1}週に${wc[w].length}回（週${S.weekMax}回まで）`,key:wc[w][0].key});wc[w].forEach(x=>cellBad.add(x.key));}}
    if(st.max!=null&&mine.length>st.max){out.push({t:'hard',m:`${st.name}：月${mine.length}回（最大${st.max}回）`});mine.forEach(x=>cellBad.add(x.key));}
    if(mine.length<st.min)out.push({t:'soft',m:`${st.name}：月${mine.length}回（最小${st.min}回に未達）`});
    if(st.weekendHayabusa){const we=mine.filter(x=>isWeekend(x.dow));if(we.length&&!we.some(x=>x.post===FEMALE_HAYABUSA))out.push({t:'soft',m:`${st.name}：土日のうち1回は${FEMALE_HAYABUSA}にしたい`});}
    if(S.prefDays==='soft')for(const x of mine)if(!st.days.includes(x.dow))out.push({t:'soft',m:`${st.name}：${x.d}日(${DAYS[x.dow]})は希望曜日外`});}
  return {out,cellBad,sol,slots};
}

const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const k in attrs||{}){const v=attrs[k];if(v===undefined||v===null||v===false)continue;if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;else if(k==='checked')e.checked=!!v;else if(k==='value')e.value=v;else e.setAttribute(k,v===true?'':v);}
  for(const c of kids.flat()){if(c==null||c===false)continue;e.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(c):c);}return e;}

    if(res.sol){beginChange();const m=M();m.assign={...res.sol.map};if(!keep)m.locks={};changed();renderMake();
      const c=checkAll();const hard=c.out.filter(v=>v.t==='hard').length,soft=c.out.filter(v=>v.t==='soft').length;toast(hard?`作成しました（必須違反 ${hard}件）。右の「チェック結果」を確認してください。`:soft?`作成しました。必須ルールはすべて守れています（要確認 ${soft}件）。`:'作成しました。問題はありません。');}
  }catch(e){console.error(e);toast('作成中にエラーが起きました：'+(e&&e.message||e));}
  finally{generating=false;pg.classList.remove('on');$('#btnGen').disabled=$('#btnRegen').disabled=false;}
}

/* ===================================================================
   操作の受け付け（document で一括）
=================================================================== */
function roGuard(){if(readOnly){toast('このページは閲覧のみです。');return true;}return false;}
const ACTS={
  tab:el=>{switchTab(el.dataset.tab);ss('tomari:tab',el.dataset.tab);closePicker();},
  undo:()=>{if(!roGuard())undo();},
  save:()=>saveAll(),
  prevMonth:()=>{state.month=shiftMonth(mk(),-1);ss('tomari:month',mk());closePicker();renderMake();},
  nextMonth:()=>{state.month=shiftMonth(mk(),1);ss('tomari:month',mk());closePicker();renderMake();},
  gen:()=>runGen(false),
  regen:()=>runGen(true),
  cancelGen:()=>{solveCancel=true;},
  clear:async()=>{if(roGuard())return;if(await askConfirm('この月の泊まり表と🔒固定を全て消します。よろしいですか？','消す')){beginChange();const m=M();m.assign={};m.locks={};changed();renderMake();}},
  xlsx:()=>exportXlsx(),
  print:()=>printTable(),
  cell:el=>{if(pop&&pop.dataset.key===el.dataset.key){closePicker();return;}openPicker(el,el.dataset.key);if(pop)pop.dataset.key=el.dataset.key;},
  pick:el=>{if(roGuard())return;beginChange();A()[el.dataset.key]=el.dataset.id;changed();closePicker();renderMake();},
  lock:el=>{if(roGuard())return;beginChange();const L_=L();L_[el.dataset.key]=!L_[el.dataset.key];changed();closePicker();renderMake();},
  emptyCell:el=>{if(roGuard())return;beginChange();delete A()[el.dataset.key];changed();closePicker();renderMake();},
  viol:el=>{const td=document.querySelector(`#grid [data-key="${CSS.escape(el.dataset.key)}"]`);if(td){td.scrollIntoView({block:'center',behavior:'smooth'});td.style.outline='3px solid var(--warn)';setTimeout(()=>td.style.outline='',1400);}},
  addStaff:()=>{if(roGuard())return;beginChange();state.staff.unshift(normalizeStaff({name:'',dept:'',sex:'男',posts:[],days:[],memo:'',order:-1}));changed();renderStaff();const f=document.querySelector('#staffTable input[data-f="sName"]');if(f)f.focus();},
  importXlsx:()=>{if(!roGuard())$('#fileXlsx').click();},
  delStaff:async el=>{if(roGuard())return;const st=staffById(el.dataset.id);if(!st)return;if(await askConfirm(`${st.name||'この行'} を削除しますか？`,'削除する')){beginChange();state.staff=state.staff.filter(x=>x.id!==st.id);changed();renderAll();}},
  togPost:el=>{if(roGuard())return;const st=staffById(el.dataset.id);if(!st)return;beginChange();const p=el.dataset.post;st.posts=st.posts.includes(p)?st.posts.filter(x=>x!==p):[...st.posts,p];changed();renderAll();},
  togDay:el=>{if(roGuard())return;const st=staffById(el.dataset.id);if(!st)return;beginChange();const d=+el.dataset.day;st.days=st.days.includes(d)?st.days.filter(x=>x!==d):[...st.days,d].sort();changed();renderAll();},
  addPost:()=>{if(roGuard())return;const nm=$('#newPost').value.trim();if(!nm)return;if(state.posts.some(p=>p.name===nm)){toast('同じ名前の持ち場があります。');return;}beginChange();state.posts.push({name:nm,req:[1,1,1,1,1,1,1]});$('#newPost').value='';changed();renderAll();},
  delPost:async el=>{if(roGuard())return;const i=+el.dataset.i;const p=state.posts[i];if(p&&await askConfirm(`持ち場「${p.name}」を削除しますか？`,'削除する')){beginChange();state.posts.splice(i,1);changed();renderAll();}},
  saveJson:()=>deliver(`泊まり表バックアップ_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(snapshot(),null,1)),
  loadJson:()=>{if(!roGuard())$('#fileJson').click();},
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(pop&&!e.target.closest('.popover')&&!(el&&el.dataset.act==='cell'))closePicker();
  if(!el||el.disabled)return;const fn=ACTS[el.dataset.act];if(fn)fn(el,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closePicker();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-act][tabindex]')){e.preventDefault();const fn=ACTS[e.target.dataset.act];if(fn)fn(e.target,e);}
  if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!e.target.matches('input,textarea,select')){e.preventDefault();if(!roGuard())undo();}
});
document.addEventListener('input',e=>{
  const el=e.target;if(el.dataset&&el.dataset.f==='pickSearch'&&pop){const q=el.value.trim();pop.querySelectorAll('.opt').forEach(o=>o.style.display=o.dataset.name.includes(q)?'':'none');}
});
document.addEventListener('change',e=>{
  const el=e.target;const f=el.dataset&&el.dataset.f;const sKey=el.dataset&&el.dataset.s;
  if(el.id==='fileXlsx'){if(el.files[0])importStaffXlsx(el.files[0]);el.value='';return;}
  if(el.id==='fileJson'){const file=el.files[0];el.value='';if(!file)return;const rd=new FileReader();rd.onload=async ev=>{try{const s=JSON.parse(ev.target.result);if(!s.staff||!s.posts)throw 0;
      if(!(await askConfirm('バックアップの内容で現在のデータ（スタッフ表・条件・各月の泊まり表）を置き換えますか？','置き換える')))return;
      beginChange();applyLoaded(s);changed();renderAll();toast('復元しました。');}catch(x){toast('読み込めませんでした。');}};rd.readAsText(file);return;}
  if(sKey){if(roGuard()){renderRules();return;}beginChange();const S=state.settings;
    if(el.type==='checkbox')S[sKey]=el.checked;else if(sKey==='weekMax')S.weekMax=Math.max(1,+el.value||2);else if(sKey==='minGap')S.minGap=Math.max(1,+el.value||1);else S[sKey]=el.value;
    changed();renderMake();return;}
  if(!f)return;
  if(f==='month'){if(!el.value)return;state.month=el.value;ss('tomari:month',mk());renderMake();return;}
  if(f==='budget'||f==='pickSearch')return;
  if(f==='mySel'){mineMem=el.value;lsSetK(LS_MINE,el.value);renderMake();return;}
  if(roGuard()){renderAll();return;}
  beginChange();
  if(f==='prevLast'){M().prevLast=el.value;}
  else if(f==='ng'){NG()[el.dataset.id]=el.value;}
  else if(f.startsWith('s')){const st=staffById(el.dataset.id);if(!st){undoStack.pop();return;}
    if(f==='sActive')st.active=el.checked;else if(f==='sName')st.name=el.value.trim();else if(f==='sDept')st.dept=el.value.trim();
    else if(f==='sSex'){st.sex=el.value;applyMemo(st);}else if(f==='sMin')st.min=+el.value||0;else if(f==='sMax')st.max=el.value===''?null:+el.value;
    else if(f==='sWeekEx')st.weeklyExempt=el.checked;else if(f==='sMemo'){st.memo=el.value;applyMemo(st);}}
  else if(f==='pName'){const p=state.posts[+el.dataset.i];const nn=el.value.trim();if(!p||!nn||nn===p.name){undoStack.pop();renderRules();return;}
    for(const st of state.staff){st.posts=st.posts.map(x=>x===p.name?nn:x);st.fixed=(st.fixed||[]).map(([d,q])=>[d,q===p.name?nn:q]);}
    for(const ym in state.months){const mo=state.months[ym];for(const obj of [mo.assign||{},mo.locks||{}])for(const k of Object.keys(obj)){const [d,post,idx]=k.split('|');if(post===p.name){obj[d+'|'+nn+'|'+idx]=obj[k];delete obj[k];}}}
    if(state.settings.waPost===p.name)state.settings.waPost=nn;p.name=nn;}
  else if(f==='pReq'){const p=state.posts[+el.dataset.i];if(p)p.req[+el.dataset.day]=Math.max(0,+el.value||0);}
  changed();renderAll();
});

boot();
</script>
